<org-header
  [products]="headerProducts()"
  [collections]="headerCollections()"
  [theme]="headerService.theme()"
  [mode]="shellMode()"
  [currentLanguage]="facade.currentLanguage()"
  [currency]="headerService.currency()"
  (languageChange)="facade.currentLanguage.set($event)"
  (currencyChange)="headerService.currency.set($event)"
></org-header>
<router-outlet></router-outlet>
@if (showFooter()) {
<org-footer
  [products]="footerProducts()"
  [collections]="footerCollections()"
  [socialLinks]="footerSocialLinks"
  (navigationSelect)="handleFooterNavigation($event)"
  (newsletterSubmit)="handleNewsletterSubmit($event)"
/>
}
