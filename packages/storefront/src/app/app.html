<app-route-loading-indicator />
<org-header
  [products]="headerProducts()"
  [collections]="headerCollections()"
  [theme]="headerService.theme()"
  [mode]="shellMode()"
  [currentLanguage]="facade.currentLanguage()"
  [currency]="headerService.currency()"
  [cartItems]="headerCartItems()"
  [cartCount]="cart.totalUnits()"
  [cartTotal]="headerCartTotal()"
  [accountRoute]="accountRoute()"
  (languageChange)="facade.currentLanguage.set($event)"
  (currencyChange)="headerService.currency.set($event)"
  (cartRemove)="handleCartItem('remove', $event)"
  (cartIncrement)="handleCartItem('increment', $event)"
  (cartDecrement)="handleCartItem('decrement', $event)"
  (cartCheckout)="handleCheckout()"
></org-header>
<router-outlet></router-outlet>
@if (showFooter()) {
<org-footer
  [products]="footerProducts()"
  [collections]="footerCollections()"
  [socialLinks]="footerSocialLinks()"
  [backgroundUrl]="footerBackgroundUrl()"
  [termsUrl]="facade.siteSetting()?.termsUrl"
  [privacyUrl]="facade.siteSetting()?.privacyUrl"
  [newsletterHeadline]="facade.siteSetting()?.newsletterHeadline"
  (navigationSelect)="handleFooterNavigation($event)"
  (newsletterSubmit)="handleNewsletterSubmit($event)"
/>
}
