<section class="brand max-[800px]:flex-col">
  <div class="brand__noise"></div>
  <picture class="brand__picture"><source media="(max-width: 800px)" srcset="/assets/images/about/about-brand-mobile.webp" /><img class="brand__image" src="/assets/images/about/about-brand.webp" alt="Priscila Skin Care" width="1440" height="1722" loading="lazy" /></picture>
  <p class="brand__label">A marca</p>
  <div class="brand__content"><div class="brand__metrics">@for(metric of metrics;track metric.value){<article><strong>{{metric.value}}</strong><p><b>{{metric.label}}</b> {{metric.description}}</p></article>}</div><footer><h2>Uma marca construída com propósito e ciência</h2><p>Ingredientes selecionados e tecnologia avançada para resultados visíveis.</p></footer></div>
</section>
