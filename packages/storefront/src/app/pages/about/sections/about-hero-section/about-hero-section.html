<org-hero-cover
  mediaType="image"
  mediaUrl="/assets/images/about/about-hero.webp"
  mobileMediaUrl="/assets/images/about/about-hero-mobile.webp"
  height="clamp(46rem, 59.722vw, 60rem)"
  mobileHeight="47.875rem"
  objectPosition="center 42%"
  mobileObjectPosition="center"
>
  <ng-template #heroContent>
    <div class="about-hero__gradient" aria-hidden="true"></div>
    <div class="about-hero__copy">
      <p>Sobre nós</p>
      <h1>A ciência por trás do brilho que a sua pele merece hoje</h1>
      <p class="about-hero__description">Desperte todo o potencial da sua pele com nossos kits Snow White. Revitalize sua pele, jovem e resistente durante todo o dia, garantindo conforto e uma tonalidade radiante.</p>
    </div>
  </ng-template>
</org-hero-cover>
