<main class="otp-page"><section class="otp-panel"><h1>{{ 'AUTH.OTP.TITLE' | translate }}</h1><p>{{ 'AUTH.OTP.SENT_TO' | translate:{ email: auth.pendingEmail() } }}</p><div class="otp-fields" (paste)="paste($event)">@for (_ of digits; track $index) {<input #digit inputmode="numeric" maxlength="1" [attr.aria-label]="('AUTH.OTP.DIGIT' | translate:{ number: $index + 1 })" (input)="update($index,$event)" (keydown)="keydown($index,$event)" />}</div>@if (invalid) {<p class="otp-error">{{ 'AUTH.OTP.INVALID' | translate }}</p>}</section><a class="otp-legal" routerLink="/">{{ 'AUTH.LEGAL' | translate }}</a></main>
