@let ingredients = content();
<section class="ingredients" aria-labelledby="ingredients-title">
  <div class="ingredients__heading">
    <h2 id="ingredients-title">Ingredientes</h2>
  </div>
  <div class="ingredients__body">
    <div class="ingredients__content">
      <div class="ingredients__images">
        @for (image of ingredients.mainIngredientsImages.slice(0, 2); track
        image) {
        <img [src]="image" alt="" loading="lazy" />
        }
      </div>
      <div class="ingredients__items">
        @for (item of items().slice(0, 4); track item.name) {
        <article>
          <h3>{{ item.name }}</h3>
          <p>{{ item.description }}</p>
        </article>
        }
      </div>
      <button type="button">
        Ver listagem completa <span aria-hidden="true">→</span>
      </button>
    </div>
    <div class="ingredients__editorial-frame">
      <img
        class="ingredients__editorial"
        [src]="ingredients.editorialImage || ingredients.bodyResultImage"
        alt=""
        loading="lazy"
      />
    </div>
  </div>
</section>
