@if (section(); as section) {
<section class="ingredients" aria-labelledby="ingredients-title">
  <div class="ingredients__content">
    <div class="ingredients__copy">
      <div class="ingredients__intro">
        <h2 id="ingredients-title">{{ section.headline }}</h2>
        <p>{{ section.description }}</p>
      </div>

      <ol class="ingredients__list">
        @for (ingredient of section.ingredients; track ingredient.id) {
        <li>
          <button
            type="button"
            [class.is-active]="activeIngredient()?.id === ingredient.id"
            [attr.aria-pressed]="activeIngredient()?.id === ingredient.id"
            aria-controls="ingredient-editorial-media"
            (click)="selectIngredient(ingredient.id)"
          >
            <span class="ingredients__index" aria-hidden="true">
              {{ ingredient.index }}
            </span>
            <span class="ingredients__name">{{ ingredient.name }}</span>
            <img
              [src]="ingredient.thumbnailImage"
              alt=""
              width="80"
              height="80"
              loading="lazy"
              decoding="async"
            />
          </button>
        </li>
        }
      </ol>

      <p class="ingredients__footnote">{{ section.footnote }}</p>
    </div>

    <div
      id="ingredient-editorial-media"
      class="ingredients__media"
      role="region"
      aria-live="polite"
      aria-atomic="true"
    >
      @for (ingredient of section.ingredients; track ingredient.id) {
      <img
        [src]="ingredient.editorialImage"
        [alt]="ingredient.name"
        width="1400"
        height="1400"
        [attr.loading]="
          activeIngredient()?.id === ingredient.id ? 'eager' : 'lazy'
        "
        decoding="async"
        [style.object-position]="ingredient.editorialPosition"
        [class.is-active]="activeIngredient()?.id === ingredient.id"
        [attr.aria-hidden]="activeIngredient()?.id !== ingredient.id"
      />
      }
    </div>
  </div>
</section>
}
