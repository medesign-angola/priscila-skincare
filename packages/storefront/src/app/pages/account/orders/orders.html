<section class="orders-page"><h1>{{'ACCOUNT.ORDERS.TITLE'|translate}}</h1>@if(auth.orders().length){<div class="order-list">@for(order of auth.orders();track order.id){<app-order-card [order]="order"/>}</div>}@else{<div class="empty"><div class="empty__icon" aria-hidden="true">⌑</div><strong>{{'ACCOUNT.ORDERS.EMPTY_TITLE'|translate}}</strong><p>{{'ACCOUNT.ORDERS.EMPTY_DESCRIPTION'|translate}}</p><a routerLink="/produtos">{{'ACCOUNT.ORDERS.SHOP'|translate}} →</a></div>}</section>
