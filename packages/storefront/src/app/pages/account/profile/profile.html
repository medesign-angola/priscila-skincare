<section class="account-page"><h1>{{'ACCOUNT.PROFILE.TITLE'|translate}}</h1><article class="profile-card"><input [formControl]="name" (blur)="saveName()" [placeholder]="'ACCOUNT.PROFILE.NAME'|translate" /><div class="email"><span>{{'ACCOUNT.PROFILE.EMAIL'|translate}}</span><strong>{{auth.customer()?.email}}</strong></div></article><article class="profile-card addresses"><header><h2>{{'ACCOUNT.PROFILE.ADDRESSES'|translate}}</h2><button type="button">+ {{'ACCOUNT.PROFILE.ADD'|translate}}</button></header><button class="address-select" type="button"><span>{{(auth.customer()?.addresses?.length ? 'ACCOUNT.PROFILE.SELECT_ADDRESS':'ACCOUNT.PROFILE.NO_ADDRESS')|translate}}</span><span>⌄</span></button></article><button class="sign-out" type="button" (click)="signOut()">{{'ACCOUNT.PROFILE.SIGN_OUT'|translate}}</button></section>
