<div class="hero-split-container relative flex items-center overflow-hidden">
  @if (hasNoise()) {
  <div class="noise-overlay"></div>
  }

  <!-- Hidden image used solely to trigger the directive onload event -->
  <img [src]="mediaUrl()" orgBlurUp #highRes="orgBlurUp" class="hidden" />

  <!-- Camada 1: Blurred Placeholder (Fades out when loaded) -->
  @if (placeholderUrl()) {
  <div
    class="absolute inset-0 w-full h-full transition-opacity duration-500 z-0"
    [class.opacity-0]="highRes.loaded()"
    [style.backgroundImage]="'url(' + placeholderUrl() + '), radial-gradient(61.64% 59.59% at 68.99% 53.43%, var(--color-burgundy-500, #B49667) 16.18%, var(--color-burgundy-800, #5F4D35) 100%)'"
    [style.backgroundBlendMode]="blendMode() + ', normal'"
    style="
      filter: blur(15px);
      transform: scale(1.08);
      background-position:
        100% 100%,
        center;
      background-size:
        auto 100%,
        auto;
      background-repeat: no-repeat, no-repeat;
    "
  ></div>
  }

  <!-- Camada 2: High-Resolution Image (Fades in when loaded) -->
  <div
    class="absolute inset-0 w-full h-full transition-opacity duration-500 z-1"
    [class.opacity-0]="!highRes.loaded()"
    [style.backgroundImage]="'url(' + mediaUrl() + '), radial-gradient(61.64% 59.59% at 68.99% 53.43%, var(--color-burgundy-500, #B49667) 16.18%, var(--color-burgundy-800, #5F4D35) 100%)'"
    [style.backgroundBlendMode]="blendMode() + ', normal'"
    style="
      background-position:
        100% 100%,
        center;
      background-size:
        auto 100%,
        auto;
      background-repeat: no-repeat, no-repeat;
    "
  ></div>

  <!-- Camada 3: Content template overlay -->
  <div
    class="w-full h-full flex flex-col justify-end text-white relative pb-20 z-10 px-4 md:px-10"
  >
    @if (contentTemplate(); as temp) {
    <ng-container *ngTemplateOutlet="temp"></ng-container>
    }
  </div>
</div>
