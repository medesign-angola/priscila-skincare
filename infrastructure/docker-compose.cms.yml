services:
  mysql:
    image: mysql:8.4
    container_name: priscila-skincare-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-priscila_skincare}
      MYSQL_USER: ${MYSQL_USER:-strapi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-strapi}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - priscila_skincare_mysql_data:/var/lib/mysql

volumes:
  priscila_skincare_mysql_data:
