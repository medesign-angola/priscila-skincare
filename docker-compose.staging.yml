name: priscila-skincare-staging

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME:-priscila_app}
      APP_DB_USER: ${APP_DB_USER:-priscila_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Defina APP_DB_PASSWORD}
      CMS_DB_NAME: ${CMS_DB_NAME:-priscila_cms}
      CMS_DB_USER: ${CMS_DB_USER:-priscila_cms}
      CMS_DB_PASSWORD: ${CMS_DB_PASSWORD:?Defina CMS_DB_PASSWORD}
      PAYMENTS_DB_NAME: ${PAYMENTS_DB_NAME:-priscila_payments}
      PAYMENTS_DB_USER: ${PAYMENTS_DB_USER:-priscila_payments}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:?Defina PAYMENTS_DB_PASSWORD}
      NOTIFICATIONS_DB_NAME: ${NOTIFICATIONS_DB_NAME:-priscila_notifications}
      NOTIFICATIONS_DB_USER: ${NOTIFICATIONS_DB_USER:-priscila_notifications}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?Defina NOTIFICATIONS_DB_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [private]

  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    command: ["--migrate"]
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__ApplicationDatabase: Server=mysql;Port=3306;Database=${APP_DB_NAME:-priscila_app};User=${APP_DB_USER:-priscila_app};Password=${APP_DB_PASSWORD};
      Jwt__Issuer: ${JWT_ISSUER:-PriscilaSkincare.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-PriscilaSkincare.Storefront}
      Jwt__Secret: ${JWT_SECRET:?Defina JWT_SECRET}
      Authentication__HashSecret: ${AUTH_HASH_SECRET:?Defina AUTH_HASH_SECRET}
      Authentication__OtpLifetimeMinutes: ${OTP_LIFETIME_MINUTES:-10}
      Authentication__ResendCooldownSeconds: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      Authentication__RefreshTokenDays: ${REFRESH_TOKEN_DAYS:-30}
      Email__DeliveryMode: ${EMAIL_DELIVERY_MODE:-Log}
      Email__Host: ${SMTP_HOST:-}
      Email__Port: ${SMTP_PORT:-587}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromEmail: ${SMTP_FROM_EMAIL:-}
      Email__FromName: ${SMTP_FROM_NAME:-Priscila Skin Care}
      Email__TimeoutSeconds: ${SMTP_TIMEOUT_SECONDS:-30}
      Email__OrderConfirmationEnabled: ${ORDER_CONFIRMATION_EMAIL_ENABLED:-true}
      Email__StorefrontUrl: ${STOREFRONT_ORIGIN:?Defina STOREFRONT_ORIGIN}
      Email__SupportEmail: ${EMAIL_SUPPORT_ADDRESS:-}
      Email__OutboxPollSeconds: ${EMAIL_OUTBOX_POLL_SECONDS:-10}
      Strapi__BaseUrl: http://cms:1337
      Strapi__IntegrationSecret: ${INTEGRATION_SECRET:?Defina INTEGRATION_SECRET}
      Payments__BaseUrl: http://payments:8080
      Payments__InternalApiKey: ${PAYMENTS_INTERNAL_API_KEY:?Defina PAYMENTS_INTERNAL_API_KEY}
      Payments__TimeoutSeconds: ${PAYMENTS_TIMEOUT_SECONDS:-15}
      Notifications__BaseUrl: http://notifications:8080
      Notifications__InternalApiKey: ${NOTIFICATIONS_INTERNAL_API_KEY:?Defina NOTIFICATIONS_INTERNAL_API_KEY}
      Notifications__TimeoutSeconds: ${NOTIFICATIONS_TIMEOUT_SECONDS:-15}
      Cors__AllowedOrigins__0: ${STOREFRONT_ORIGIN:?Defina STOREFRONT_ORIGIN}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [private]
    profiles: [migration]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: *api-environment
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8098}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      cms:
        condition: service_healthy
      payments:
        condition: service_healthy
      notifications:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks: [private]

  payments:
    image: ${PAYMENTS_IMAGE:-ghcr.io/medesign-angola/priscila-payments-service:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__PaymentsDatabase: Server=mysql;Port=3306;Database=${PAYMENTS_DB_NAME:-priscila_payments};User=${PAYMENTS_DB_USER:-priscila_payments};Password=${PAYMENTS_DB_PASSWORD};SslMode=Disabled;
      Payments__InternalApiKey: ${PAYMENTS_INTERNAL_API_KEY:?Defina PAYMENTS_INTERNAL_API_KEY}
      Payments__Provider: ${PAYMENTS_PROVIDER:-Simulated}
      Payments__CallbackBaseUrl: http://api:8080
      Payments__CallbackInternalApiKey: ${PAYMENTS_INTERNAL_API_KEY:?Defina PAYMENTS_INTERNAL_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks: [private]

  notifications:
    image: ${NOTIFICATIONS_IMAGE:-ghcr.io/medesign-angola/priscila-notifications-service:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__NotificationsDatabase: Server=mysql;Port=3306;Database=${NOTIFICATIONS_DB_NAME:-priscila_notifications};User=${NOTIFICATIONS_DB_USER:-priscila_notifications};Password=${NOTIFICATIONS_DB_PASSWORD};SslMode=Disabled;
      Notifications__Provider: ${EMAIL_PROVIDER:-Smtp}
      Notifications__InternalApiKey: ${NOTIFICATIONS_INTERNAL_API_KEY:?Defina NOTIFICATIONS_INTERNAL_API_KEY}
      Notifications__Host: ${SMTP_HOST:-}
      Notifications__Port: ${SMTP_PORT:-587}
      Notifications__Username: ${SMTP_USERNAME:-}
      Notifications__Password: ${SMTP_PASSWORD:-}
      Notifications__FromEmail: ${SMTP_FROM_EMAIL:-}
      Notifications__FromName: ${SMTP_FROM_NAME:-Priscila Skincare}
      Notifications__StorefrontUrl: ${STOREFRONT_ORIGIN:?Defina STOREFRONT_ORIGIN}
      Notifications__SupportEmail: ${EMAIL_SUPPORT_ADDRESS:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks: [private]

  cms:
    build:
      context: ./apps/cms
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CMS_HOST_PORT:-8099}:1337"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: https://${CMS_DOMAIN:?Defina CMS_DOMAIN}
      IS_PROXIED: "true"
      DATABASE_CLIENT: mysql
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${CMS_DB_NAME:-priscila_cms}
      DATABASE_USERNAME: ${CMS_DB_USER:-priscila_cms}
      DATABASE_PASSWORD: ${CMS_DB_PASSWORD}
      DATABASE_SSL: "false"
      APP_KEYS: ${STRAPI_APP_KEYS:?Defina STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT:?Defina STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET:?Defina STRAPI_ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT:?Defina STRAPI_TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${STRAPI_JWT_SECRET:?Defina STRAPI_JWT_SECRET}
      ENCRYPTION_KEY: ${STRAPI_ENCRYPTION_KEY:?Defina STRAPI_ENCRYPTION_KEY}
      APPLICATION_API_URL: http://api:8080
      REVIEW_INTEGRATION_SECRET: ${INTEGRATION_SECRET}
      CORS_ORIGINS: ${STOREFRONT_ORIGIN}
      UPLOAD_PROVIDER: local
      CMS_BOOTSTRAP_LOCALES: "true"
      CMS_BOOTSTRAP_PUBLIC_READ: "true"
      CMS_SEED_BASE_DATA: "false"
    volumes:
      - strapi_uploads:/opt/app/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:1337/_health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [private]

networks:
  private:
    driver: bridge

volumes:
  mysql_data:
  strapi_uploads:
